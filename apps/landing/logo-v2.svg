<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TON Agent Platform">
  <defs>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- BACK half of dashed orbit (drawn BEFORE the letter A so A covers intersections) -->
  <!-- Orbit is an ellipse tilted -18deg, rendered as two half-arcs -->
  <path
    d="M 150 210 A 140 70 -18 1 1 380 180"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="12 11"
    opacity="0.92"/>

  <!-- Letter A — bold geometric sans-serif, sharp triangular apex -->
  <g filter="url(#logo-glow)">
    <path
      d="
        M 256 108
        L 348 408
        L 292 408
        L 272 330
        L 240 330
        L 220 408
        L 164 408
        L 256 108 Z
        M 250 280
        L 262 280
        L 256 242 Z
      "
      fill="#ffffff"
      fill-rule="evenodd"/>
  </g>

  <!-- FRONT half of orbit (over the A) -->
  <path
    d="M 380 180 A 140 70 -18 0 1 260 365"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="12 11"
    opacity="0.92"/>

  <!-- Paper plane (origami) — top-right of letter, pointing up-right ~32deg -->
  <g filter="url(#logo-glow)" transform="translate(380 160) rotate(-32)">
    <!-- Outer triangle body -->
    <path
      d="M 0 0 L 62 -20 L 42 28 L 22 14 Z"
      fill="#ffffff"/>
    <!-- Inner fold line (separates top wing from bottom) -->
    <path
      d="M 0 0 L 42 28"
      stroke="#000000"
      stroke-width="2.5"
      fill="none"
      stroke-linecap="round"/>
  </g>
</svg>
