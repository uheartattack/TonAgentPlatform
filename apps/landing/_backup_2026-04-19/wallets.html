<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <title>Agentic Wallets — TON Agent Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a28;
      --border: #1e1e2e;
      --border-active: #3b82f6;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --text-muted: #52525b;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.15);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15);
      --yellow: #eab308;
      --yellow-dim: rgba(234,179,8,0.15);
      --purple: #a855f7;
      --purple-dim: rgba(168,85,247,0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: var(--text-dim); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-danger { background: var(--red-dim); border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-success { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .btn-success:hover { background: var(--green); color: white; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Layout ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-card .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      font-weight: 600;
    }
    .stat-card .stat-value {
      font-size: 28px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-card .stat-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.blue .stat-value { color: var(--accent); }
    .stat-card.purple .stat-value { color: var(--purple); }
    .stat-card.yellow .stat-value { color: var(--yellow); }

    /* ── Root Wallet Banner ── */
    .root-banner {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1));
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .root-info { flex: 1; }
    .root-info h2 { font-size: 16px; margin-bottom: 6px; }
    .root-info .root-address {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      cursor: pointer;
    }
    .root-info .root-address:hover { color: var(--accent); }
    .root-balance {
      text-align: right;
    }
    .root-balance .amount {
      font-size: 24px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--green);
    }
    .root-balance .label {
      font-size: 12px;
      color: var(--text-dim);
    }

    .setup-banner {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .setup-banner h2 { font-size: 20px; margin-bottom: 12px; }
    .setup-banner p { color: var(--text-dim); margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .setup-banner .setup-actions { display: flex; gap: 12px; justify-content: center; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .toolbar h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .toolbar-actions { display: flex; gap: 8px; }

    /* ── Wallet Cards ── */
    .wallets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .wallet-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
    }
    .wallet-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .wallet-card.blocked {
      border-color: var(--red);
      opacity: 0.7;
    }

    .wallet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .wallet-name {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wallet-status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .wallet-status.blocked { background: var(--red); }

    .wallet-address {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
    }
    .wallet-address:hover { color: var(--accent); }

    .wallet-balance {
      font-size: 22px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--green);
      margin-bottom: 12px;
    }
    .wallet-balance .currency { font-size: 14px; color: var(--text-dim); font-weight: 500; }

    .wallet-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .wallet-meta span { display: flex; align-items: center; gap: 4px; }

    .wallet-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 16px; }
    .modal .form-group { margin-bottom: 16px; }
    .modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
    .modal input, .modal select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .modal input:focus, .modal select:focus { border-color: var(--accent); outline: none; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── Transactions ── */
    .tx-list { margin-top: 16px; }
    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-dir { font-size: 18px; margin-right: 8px; }
    .tx-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .tx-amount.incoming { color: var(--green); }
    .tx-amount.outgoing { color: var(--red); }
    .tx-time { color: var(--text-dim); font-size: 12px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--text);
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { margin-bottom: 8px; color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .wallets-grid { grid-template-columns: 1fr; }
      .root-banner { flex-direction: column; text-align: center; }
      .root-balance { text-align: center; }
      .toolbar { flex-direction: column; gap: 12px; }
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Auth ── */
    .auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      max-width: 400px;
    }
    .auth-box h2 { margin-bottom: 12px; }
    .auth-box p { color: var(--text-dim); margin-bottom: 24px; }
  </style>
</head>
<body>

<div id="auth-screen" class="auth-screen" style="display:none">
  <div class="auth-box">
    <h2>🔐 Agentic Wallets</h2>
    <p>Sign in via Telegram to manage your wallets</p>
    <a href="https://t.me/TonAgentPlatformBot?start=auth" class="btn btn-primary" style="display:inline-flex">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.492-1.302.483-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141a.506.506 0 01.171.325c.016.093.036.306.02.472z"/></svg>
      Open Bot
    </a>
  </div>
</div>

<div id="app" style="display:none">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
      </div>
      <h1><span>Agentic</span> Wallets</h1>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="refreshAll()" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <a class="btn" href="studio.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Studio
      </a>
    </div>
  </header>

  <div class="container">
    <!-- Root Wallet Banner -->
    <div id="root-section"></div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Wallets -->
    <div class="toolbar">
      <h2 id="wallets-title">Agent Wallets</h2>
      <div class="toolbar-actions">
        <button class="btn btn-primary" onclick="showDeployModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Wallet
        </button>
      </div>
    </div>

    <div id="wallets-grid" class="wallets-grid"></div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="wallets.js?v=1"></script>
</body>
</html>
