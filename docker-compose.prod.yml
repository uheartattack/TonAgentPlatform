# TON Agent Platform — Production Docker Compose
# Usage: docker compose up -d

services:
  # ─── Database ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ton-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ton_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — do not use default}
      POSTGRES_DB: ${DB_NAME:-ton_agent_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ton_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: ton-agent-network
